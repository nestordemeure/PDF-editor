[package]
name = "pdf-editor-web"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "The desktop engine compiled to WebAssembly for the web app"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
console_error_panic_hook = "0.1"
pdf-editor = { path = "..", default-features = false }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Must equal the version of the wasm-bindgen command-line tool.
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
